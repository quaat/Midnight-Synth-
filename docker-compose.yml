version: '3.9'
services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - '8000:8000'
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    # Audio/MIDI passthrough is host-OS specific and usually requires privileged setup.
  frontend:
    image: node:20
    working_dir: /app
    volumes:
      - ./frontend:/app
    command: sh -c "npm install && npm run dev"
    environment:
      - NEXT_PUBLIC_SYNTH_URL=http://backend:8000
    ports:
      - '3000:3000'
    depends_on:
      - backend
